<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPA · 错题学习台</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="vendor/katex/katex.min.css"><script defer src="vendor/katex/katex.min.js"></script><script defer src="vendor/katex/contrib/auto-render.min.js"></script></head><body><main><header><span class="eyebrow">MPA / STUDY WORKSPACE</span><h1>每一次复习，都更进一步。</h1><p>管综错题学习台 · 题库随网站更新，个人记录保存在本机。跨设备请导出与导入，不提供实时同步。</p></header><section id="stats" class="stats" aria-label="学习概览"></section><nav aria-label="学习入口"><button data-view="all">题库</button><button data-view="random">随机练习</button><button data-view="due">今日任务</button><button data-view="favorite">我的收藏</button><button data-view="topics">知识点</button><button data-view="statistics">复习统计</button></nav><section class="tools"><label>搜索<input id="search" type="search" placeholder="题号、题干、解析…"></label><label>年份<select id="year"><option value="">全部年份</option></select></label><label>科目<select id="subject"><option value="">数学与逻辑</option><option>数学</option><option>逻辑</option></select></label><label>知识点<select id="topic"><option value="">全部知识点</option></select></label></section><div class="backup"><button id="export">导出复习记录</button><button id="export-v2">导出 v2（不含冲突历史）</button><button id="emergency">紧急导出草稿与原始数据</button><label class="file">导入复习记录<input id="import" type="file" accept="application/json,.json"></label></div><p id="sync-status" role="status">仅本地 · 云同步未配置；待发送项保留本机</p><button id="retry-sync" type="button">重试同步</button><p id="save-status" role="status" aria-live="polite">正在打开本机数据库…</p><p id="message" role="status" aria-live="polite"></p><section id="overview"></section><p id="count"></p><section id="questions"></section><footer>原题不全时保留缺失标记；历史答案未经擅自修改。未获公开授权的截图不会进入公开构建。</footer></main><script type="module" src="app.js"></script></body></html>
