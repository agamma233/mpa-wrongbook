name: Validate and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official Playwright 1.62.1 image: browsers + signed distro dependencies,
    # pinned to its verified multi-platform digest; avoid flaky runner apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python scripts/check_secrets.py
      - run: python scripts/manage.py validate
      - run: python scripts/manage.py audit
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.test.js
      - run: python scripts/manage.py build
      - run: npm install --ignore-scripts
      - run: node tests/cloud-sql.mjs
      - run: npx playwright install chromium webkit
      - run: npm run test:browser
      - run: BROWSER_ENGINE=webkit npm run test:browser
      - run: node tests/reliability.mjs
      - run: BROWSER_ENGINE=webkit node tests/reliability.mjs
      - run: node tests/transport.mjs
      - run: BROWSER_ENGINE=webkit node tests/transport.mjs
      - run: node tests/cloud.mjs
      - run: BROWSER_ENGINE=webkit node tests/cloud.mjs
      - run: python scripts/verify_fixture.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
